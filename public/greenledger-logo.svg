<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 76" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #10221B;
        font-size: 33px;
        letter-spacing: -0.8px;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #277958;
        font-size: 11px;
        letter-spacing: 3.4px;
      }
    </style>
  </defs>

  <!-- Green Squircle Icon Box -->
  <rect x="2" y="2" width="72" height="72" rx="20" fill="#134C35" />

  <!-- Stylized White Outline Leaf -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Leaf Outline -->
    <path
      d="M 19,53 C 18,45 22,29 36,22 C 43,18 51,19 53,20 C 54,22 55,30 50,38 C 43,49 27,54 19,53 Z"
      stroke-width="4.5"
    />
    <!-- Center Vein -->
    <path
      d="M 21,51 C 26,45 34,38 48,25"
      stroke-width="4.2"
    />
  </g>

  <!-- Wordmark Text -->
  <text x="90" y="44" class="brand-title">greenledger</text>
  <text x="91" y="62" class="brand-sub">CLAIM INTEGRITY</text>
</svg>
